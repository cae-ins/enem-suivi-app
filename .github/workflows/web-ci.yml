name: Web CI

on:
  push:
    branches: [main, ameliorations-tkinter]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_USE_SQLITE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/backend/requirements-dev.txt
      - run: pip install -r web/backend/requirements-dev.txt
      - run: python -m pytest -q -c web/backend/pytest.ini web/backend/tests
      - run: python -m web.backend.manage check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
