name: enem-suivi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enem_suivi}
      POSTGRES_USER: ${POSTGRES_USER:-enem_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enem-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-enem-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-enem-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enem_app:enem-local-only@postgres:5432/enem_suivi}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-enem-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-enem-local-only}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ${ENEM_LOCAL_DATA_PATH:-./reference}:/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    command: celery -A web.backend.config worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://enem_app:enem-local-only@postgres:5432/enem_suivi}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-enem-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-enem-local-only}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    volumes:
      - ${ENEM_LOCAL_DATA_PATH:-./reference}:/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
